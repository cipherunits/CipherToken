# ============================================================================
# CipherToken documentation — Zensical configuration
#
# Note: when the [project] table is present, Zensical only reads keys inside
# it. Keep every setting under [project.*].
# ============================================================================

[project]
site_name = "CipherToken"

# Kept under 155 characters so search engines show it as-is in snippets.
site_description = "CipherToken is a high-performance Python JWT library built with Rust. Fast token creation, verification, rotation and key management."
site_author = "Cipher-Unit"

# Required for canonical URLs and the auto-generated sitemap.xml.
site_url = "https://cipherunits.github.io/CipherToken/"

repo_url = "https://github.com/cipherunits/CipherToken"
repo_name = "CipherToken"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 <a href="https://cipherunit.xyz/" target="_blank" rel="noopener">Cipher-Unit</a>
"""

language = "en"

nav = [
    { "Home" = "index.md", icon = "fontawesome/solid/house" },
    { "Get Started" = "getting-started/index.md", icon = "fontawesome/solid/rocket" },
    { "Installation" = "getting-started/installation.md", icon = "fontawesome/solid/download" },
    { "Quick Start" = "getting-started/quick-start.md", icon = "fontawesome/solid/bolt" },
    { "Benchmarks" = "benchmarks.md", icon = "fontawesome/solid/gauge-high" },
    { "Comparison" = "comparison.md", icon = "fontawesome/solid/scale-balanced" },
    { "API Reference" = "reference/index.md", icon = "fontawesome/solid/book" },
    { "Advanced" = "advanced/index.md", icon = "fontawesome/solid/gear" },
    { "FAQ" = "faq.md", icon = "fontawesome/solid/circle-question" },
]

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

[project.theme]
logo = "logo.png"
favicon = "logo.png"
primary = "indigo"

# Custom templates (SEO meta tags, Open Graph, Twitter cards, JSON-LD).
custom_dir = "overrides"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/cipherunits/CipherToken" },
    { icon = "fontawesome/brands/python", link = "https://pypi.org/project/ciphertoken/" },
    { icon = "lucide/globe", link = "https://cipherunit.xyz/" },
]

# Site-wide SEO defaults consumed by overrides/main.html. Pages can override
# "description", "image" and "keywords" in their front matter.
[project.extra.seo]
default_image = "https://cipherunits.github.io/CipherToken/logo.png"
twitter_site = "@CipherToken"
og_type = "website"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
